spring:
  config:
    activate:
      on-profile: test
  flyway:
    locations: classpath:db/migration,classpath:db/test
  datasource:
    url: ${TPV_TEST_DB_URL:jdbc:tc:postgresql:17-alpine:///tpv_saas}
    driver-class-name: ${TPV_TEST_DB_DRIVER:org.testcontainers.jdbc.ContainerDatabaseDriver}
    username: ${TPV_TEST_DB_USERNAME:test}
    password: ${TPV_TEST_DB_PASSWORD:test}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

tpv:
  saas:
    legacy-basic-auth-enabled: true
    secrets:
      encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
