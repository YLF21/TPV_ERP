server:
  port: ${TPV_SAAS_PORT:8090}
  forward-headers-strategy: ${TPV_SAAS_FORWARD_HEADERS_STRATEGY:framework}

spring:
  application:
    name: tpv-erp-saas-backend
  datasource:
    url: ${TPV_SAAS_DB_URL:jdbc:postgresql://localhost:5432/tpv_erp_saas}
    username: ${TPV_SAAS_DB_USERNAME:tpv_erp_saas}
    password: ${TPV_SAAS_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

tpv:
  saas:
    admin-default-allowed: ${TPV_SAAS_ADMIN_DEFAULT_ALLOWED:false}
    legacy-basic-auth-enabled: ${TPV_SAAS_LEGACY_BASIC_AUTH_ENABLED:false}
    operational-incidents:
      category-bootstrap-inactivity: ${TPV_SAAS_CATEGORY_BOOTSTRAP_INACTIVITY:PT1H}
    cors:
      allowed-origins: ${TPV_SAAS_CORS_ALLOWED_ORIGINS:}
    secrets:
      encryption-key: ${TPV_SAAS_SECRET_ENCRYPTION_KEY:}
