name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: tpv_erp_test
          POSTGRES_USER: tpv_erp_test
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tpv_erp_test -d tpv_erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: chmod +x mvnw
      - run: psql -h localhost -U tpv_erp_test -d tpv_erp_test -c "create extension if not exists pg_trgm"
        env:
          PGPASSWORD: admin
      - run: ./mvnw --batch-mode test
        env:
          TPV_TEST_DB_URL: jdbc:postgresql://localhost:5432/tpv_erp_test
          TPV_TEST_DB_USERNAME: tpv_erp_test
          TPV_TEST_DB_PASSWORD: admin
          TPV_ERP_TEST_DB_URL: jdbc:postgresql://localhost:5432/tpv_erp_test
          TPV_ERP_TEST_DB_USER: tpv_erp_test
          TPV_ERP_TEST_DB_PASSWORD: admin

  gestion-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: tpv_erp_test
          POSTGRES_USER: tpv_erp_test
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tpv_erp_test -d tpv_erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: chmod +x backend/mvnw
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test e2e/stock-apps.spec.ts e2e/app-gestion-core-flows.spec.ts
        working-directory: frontend
        env:
          E2E_DB_USERNAME: tpv_erp_test
          E2E_DB_PASSWORD: admin
          TPV_TEST_DB_URL: jdbc:postgresql://localhost:5432/tpv_erp_test
          TPV_DB_URL: jdbc:postgresql://localhost:5432/tpv_erp_test
          TPV_DEV_SAMPLE_DATA_ENABLED: "true"
          TPV_DEV_UNLICENSED_ACCESS_ENABLED: "true"
          TPV_INSTALLATION_PORTABLE_SECRET_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          E2E_MAVEN_COMMAND: ./mvnw
