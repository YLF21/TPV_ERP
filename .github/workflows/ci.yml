name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tpv_erp_test
          POSTGRES_USER: tpv_erp_test
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tpv_erp_test -d tpv_erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        module:
          - backend
          - backend-saas
          - license-issuer
          - payment-terminal-bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        env:
          TPV_TEST_DB_URL: jdbc:postgresql://localhost:5432/tpv_erp_test
          TPV_TEST_DB_USERNAME: tpv_erp_test
          TPV_TEST_DB_PASSWORD: admin
        run: mvn --batch-mode --no-transfer-progress verify

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module:
          - frontend
          - frontend-saas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.module }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.module }}
        run: npm ci
      - name: Unit tests
        working-directory: ${{ matrix.module }}
        run: npm test
      - name: Build
        working-directory: ${{ matrix.module }}
        run: npm run build
