name: CI

on:
  push:
    branches: ["main"]
    tags: ["saas-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_DB: tpv_erp_test
          POSTGRES_USER: tpv_erp_test
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tpv_erp_test -d tpv_erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        module:
          - backend
          - license-issuer
          - payment-terminal-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        env:
          TPV_TEST_DB_URL: jdbc:postgresql://localhost:5432/tpv_erp_test
          TPV_TEST_DB_USERNAME: tpv_erp_test
          TPV_TEST_DB_PASSWORD: admin
        run: mvn --batch-mode --no-transfer-progress verify
  saas-java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_DB: tpv_erp_test
          POSTGRES_USER: tpv_erp_test
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tpv_erp_test -d tpv_erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify backend-saas
        working-directory: backend-saas
        env:
          TPV_TEST_DB_URL: jdbc:postgresql://localhost:5432/tpv_erp_test
          TPV_TEST_DB_DRIVER: org.postgresql.Driver
          TPV_TEST_DB_USERNAME: tpv_erp_test
          TPV_TEST_DB_PASSWORD: admin
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Assert Admin API and outbox permission contracts ran
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = Path("backend-saas/target/surefire-reports")
          required = (
              "com.tpverp.saas.admin.AdminApiTest",
              "com.tpverp.saas.admin.OutboxOperationsControllerTest",
              "com.tpverp.saas.admin.OutboxOperationsServiceTest",
          )
          for suite in required:
              report = reports / f"TEST-{suite}.xml"
              if not report.is_file():
                  raise SystemExit(f"Required PostgreSQL contract did not run: {suite}")
              root = ET.parse(report).getroot()
              tests = int(root.attrib.get("tests", "0"))
              failures = int(root.attrib.get("failures", "0"))
              errors = int(root.attrib.get("errors", "0"))
              if tests < 1 or failures or errors:
                  raise SystemExit(
                      f"Invalid contract result for {suite}: tests={tests}, failures={failures}, errors={errors}"
                  )
          print("Admin API and outbox permission contracts executed successfully")
      - name: Upload SaaS coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-saas-jacoco
          path: backend-saas/target/site/jacoco/
          if-no-files-found: warn

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module:
          - frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: ${{ matrix.module }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.module }}
        run: npm ci
      - name: Unit tests
        working-directory: ${{ matrix.module }}
        run: npm test
      - name: Build
        working-directory: ${{ matrix.module }}
        run: npm run build

  saas-javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: frontend-saas/package-lock.json
      - name: Install
        working-directory: frontend-saas
        run: npm ci
      - name: Install browser for autonomous SaaS E2E
        working-directory: frontend-saas
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        working-directory: frontend-saas
        run: npm test
      - name: Autonomous SaaS E2E
        working-directory: frontend-saas
        run: npm run test:e2e
      - name: Build
        working-directory: frontend-saas
        run: npm run build

  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-compose-validation-only
      TPV_SAAS_SECRET_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TPV_SAAS_BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-validation-only
      TPV_SAAS_SECURITY_WEBHOOK_URL: https://security.example.test/events
      TPV_SAAS_SECURITY_WEBHOOK_SECRET: ci-security-webhook-validation-only
      TPV_SAAS_INTEGRATION_WEBHOOK_URL: https://integration.example.test/events
      TPV_SAAS_INTEGRATION_WEBHOOK_SECRET: ci-integration-webhook-validation-only
      TPV_SAAS_CORS_ALLOWED_ORIGINS: https://saas.example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate production Compose
        run: docker compose --env-file backend-saas/.env.production.example -f backend-saas/docker-compose.yml config --quiet
      - name: Build pinned production images
        run: docker compose --env-file backend-saas/.env.production.example -f backend-saas/docker-compose.yml build --pull
      - name: Validate Flyway migration inventory
        shell: python
        run: |
          from collections import Counter
          from pathlib import Path
          import re

          root = Path("backend-saas/src/main/resources/db/migration")
          candidates = sorted(path.name for path in root.glob("V*.sql"))
          if not candidates:
              raise SystemExit("No Flyway migrations found")
          invalid = [name for name in candidates if not re.fullmatch(r"V[0-9]+__[A-Za-z0-9_]+\.sql", name)]
          if invalid:
              raise SystemExit(f"Invalid Flyway names: {invalid}")
          files = candidates
          versions = [int(name[1:name.index("__")]) for name in files]
          duplicates = sorted(version for version, count in Counter(versions).items() if count > 1)
          if duplicates:
              raise SystemExit(f"Duplicate Flyway versions: {duplicates}")
          latest = max(versions)
          if latest < 52:
              raise SystemExit(f"Production retention contract requires V52 or newer; latest is V{latest}")
          fiscal_files = [root / name for name in files if name.startswith(("V49__", "V50__"))]
          fiscal_contract = "\n".join(path.read_text(encoding="utf-8").lower() for path in fiscal_files)
          required_fiscal_tokens = (
              "fiscal_reason",
              "fiscal_legal_basis",
              "fiscal_evidence_reference",
              "saas_invoice_fiscal_decision_audit",
          )
          missing_fiscal = [token for token in required_fiscal_tokens if token not in fiscal_contract]
          if missing_fiscal:
              raise SystemExit(f"Missing V49/V50 fiscal contract tokens: {missing_fiscal}")
          recovery_files = [root / name for name in files if name.startswith("V50__")]
          recovery_contract = "\n".join(path.read_text(encoding="utf-8").lower() for path in recovery_files)
          required_recovery_tokens = (
              "acknowledged",
              "recovered_orphan_claim",
              "idx_saas_security_outbox_failed",
              "idx_saas_integration_run_failed_delivery",
          )
          missing_recovery = [token for token in required_recovery_tokens if token not in recovery_contract]
          if missing_recovery:
              raise SystemExit(f"Missing V50 recovery contract tokens: {missing_recovery}")
          retention_files = [root / name for name in files if name.startswith("V51__")]
          retention_contract = "\n".join(path.read_text(encoding="utf-8").lower() for path in retention_files)
          required_retention_tokens = (
              "non-transactional",
              "create index concurrently",
              "encrypted_payload",
              "acknowledged",
          )
          missing_retention = [token for token in required_retention_tokens if token not in retention_contract]
          if missing_retention:
              raise SystemExit(f"Missing V51 non-transactional retention contract tokens: {missing_retention}")
          integration_retention_files = [root / name for name in files if name.startswith("V52__")]
          integration_retention_contract = "\n".join(
              path.read_text(encoding="utf-8").lower() for path in integration_retention_files
          )
          required_integration_retention_tokens = (
              "non-transactional",
              "create index concurrently",
              "payload",
              "acknowledged",
          )
          missing_integration_retention = [
              token for token in required_integration_retention_tokens
              if token not in integration_retention_contract
          ]
          if missing_integration_retention:
              raise SystemExit(
                  f"Missing V52 non-transactional retention contract tokens: {missing_integration_retention}"
              )
          print(
              f"Validated {len(files)} unique Flyway migrations; latest V{latest}; "
              "fiscal, recovery and retention contracts present"
          )
      - name: Generate reproducible release evidence
        shell: bash
        run: |
          mkdir -p release-evidence
          {
            echo "commit=$GITHUB_SHA"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "external_tls=NOT_VALIDATED_UNLESS_PUBLIC_URL_CONFIGURED"
            echo "restore=NOT_VALIDATED_BY_CI"
            echo "rollback=NOT_VALIDATED_BY_CI"
            echo "rpo_rto=NOT_APPROVED_BY_CI"
            echo "browser_fiscal_outbox=AUTONOMOUS_MOCK"
            echo "postgres_contracts=ADMIN_API_AND_OUTBOX_PERMISSIONS"
            echo "real_browser=READINESS_AND_AUTHENTICATION"
          } > release-evidence/status.txt
          sha256sum \
            backend-saas/docker-compose.yml \
            backend-saas/Dockerfile \
            frontend-saas/Dockerfile \
            frontend-saas/nginx.conf \
            backend-saas/src/main/resources/db/migration/V49__production_delivery_and_fiscal_evidence.sql \
            backend-saas/src/main/resources/db/migration/V50__outbox_operational_recovery.sql \
            backend-saas/src/main/resources/db/migration/V51__security_payload_retention_index.sql \
            backend-saas/src/main/resources/db/migration/V52__integration_payload_retention_index.sql \
            > release-evidence/candidate-sha256.txt
          docker compose --env-file backend-saas/.env.production.example \
            -f backend-saas/docker-compose.yml config --images \
            > release-evidence/image-references.txt
          docker compose --env-file backend-saas/.env.production.example \
            -f backend-saas/docker-compose.yml images --format json \
            > release-evidence/local-image-inventory.json
      - name: Validate external TLS when a public URL is configured
        shell: bash
        env:
          PUBLIC_URL: ${{ vars.TPV_SAAS_PUBLIC_URL }}
          RELEASE_GATE_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/saas-v') }}
        run: |
          mkdir -p release-evidence
          if [[ -z "$PUBLIC_URL" ]]; then
            echo "NOT_CONFIGURED: set repository variable TPV_SAAS_PUBLIC_URL for the live TLS gate" \
              > release-evidence/tls.txt
            [[ "$RELEASE_GATE_REQUIRED" != "true" ]]
            exit 0
          fi
          [[ "$PUBLIC_URL" == https://* ]]
          headers_file=$(mktemp)
          curl --fail --silent --show-error \
            --dump-header "$headers_file" \
            --output /dev/null --write-out '%{http_code}' "$PUBLIC_URL" \
            > release-evidence/tls-http-status.txt
          grep -Eq '^2[0-9][0-9]$' release-evidence/tls-http-status.txt
          grep -i '^strict-transport-security:' "$headers_file" \
            > release-evidence/tls-hsts.txt
          rm -f "$headers_file"
          echo "PASS" > release-evidence/tls.txt
      - name: Record RPO and RTO approval inputs
        shell: bash
        env:
          APPROVED_RPO: ${{ vars.TPV_SAAS_APPROVED_RPO }}
          APPROVED_RTO: ${{ vars.TPV_SAAS_APPROVED_RTO }}
          RPO_RTO_EVIDENCE: ${{ vars.TPV_SAAS_RPO_RTO_EVIDENCE }}
          RELEASE_GATE_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/saas-v') }}
        run: |
          mkdir -p release-evidence
          if [[ -z "$APPROVED_RPO" || -z "$APPROVED_RTO" || -z "$RPO_RTO_EVIDENCE" ]]; then
            echo "NOT_CONFIGURED: set TPV_SAAS_APPROVED_RPO, TPV_SAAS_APPROVED_RTO and TPV_SAAS_RPO_RTO_EVIDENCE" \
              > release-evidence/rpo-rto.txt
            [[ "$RELEASE_GATE_REQUIRED" != "true" ]]
            exit 0
          fi
          [[ -n "$APPROVED_RPO" && -n "$APPROVED_RTO" ]]
          printf 'approved_rpo=%s\napproved_rto=%s\nevidence=%s\n' \
            "$APPROVED_RPO" "$APPROVED_RTO" "$RPO_RTO_EVIDENCE" \
            > release-evidence/rpo-rto.txt
      - name: Require restore and rollback evidence for release tags
        shell: bash
        env:
          RESTORE_EVIDENCE: ${{ vars.TPV_SAAS_RESTORE_EVIDENCE }}
          ROLLBACK_EVIDENCE: ${{ vars.TPV_SAAS_ROLLBACK_EVIDENCE }}
          RELEASE_GATE_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/saas-v') }}
        run: |
          mkdir -p release-evidence
          if [[ -z "$RESTORE_EVIDENCE" || -z "$ROLLBACK_EVIDENCE" ]]; then
            echo "NOT_CONFIGURED: set TPV_SAAS_RESTORE_EVIDENCE and TPV_SAAS_ROLLBACK_EVIDENCE" \
              > release-evidence/recovery.txt
            [[ "$RELEASE_GATE_REQUIRED" != "true" ]]
            exit 0
          fi
          printf 'restore_evidence=%s\nrollback_evidence=%s\n' \
            "$RESTORE_EVIDENCE" "$ROLLBACK_EVIDENCE" > release-evidence/recovery.txt
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saas-release-evidence
          path: release-evidence/
          if-no-files-found: error

  saas-e2e:
    needs: [saas-java, saas-javascript, release-config]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_DB: tpv_erp_saas_e2e
          POSTGRES_USER: tpv_erp_saas_e2e
          POSTGRES_PASSWORD: e2e-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tpv_erp_saas_e2e -d tpv_erp_saas_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: frontend-saas/package-lock.json
      - name: Install SaaS frontend and browser
        working-directory: frontend-saas
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start SaaS backend
        working-directory: backend-saas
        env:
          SPRING_PROFILES_ACTIVE: local
          TPV_SAAS_PORT: "8090"
          TPV_SAAS_DB_URL: jdbc:postgresql://127.0.0.1:5432/tpv_erp_saas_e2e
          TPV_SAAS_DB_USERNAME: tpv_erp_saas_e2e
          TPV_SAAS_DB_PASSWORD: e2e-only
          TPV_SAAS_SECRET_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          TPV_SAAS_CORS_ALLOWED_ORIGINS: http://127.0.0.1:5175
        run: |
          mvn --batch-mode --no-transfer-progress spring-boot:run > ../saas-backend-e2e.log 2>&1 &
          echo $! > ../saas-backend-e2e.pid
      - name: Start SaaS frontend
        working-directory: frontend-saas
        run: |
          npm run dev -- --port 5175 > ../saas-frontend-e2e.log 2>&1 &
          echo $! > ../saas-frontend-e2e.pid
      - name: Wait for functional readiness
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8090/actuator/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8090/actuator/saasSecurity >/dev/null \
              && curl --fail --silent http://127.0.0.1:5175/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 200 saas-backend-e2e.log || true
          tail -n 100 saas-frontend-e2e.log || true
          exit 1
      - name: SaaS browser smoke
        working-directory: frontend-saas
        env:
          SAAS_E2E_URL: http://127.0.0.1:5175/
          SAAS_E2E_REAL_BACKEND: "true"
          SAAS_E2E_USERNAME: ADMIN
          SAAS_E2E_PASSWORD: "0000"
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: saas-e2e-logs
          path: |
            saas-backend-e2e.log
            saas-frontend-e2e.log

  security-artifacts:
    needs: [saas-java, saas-javascript]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: frontend-saas/package-lock.json
      - name: Generate backend CycloneDX SBOM
        working-directory: backend-saas
        run: mvn --batch-mode --no-transfer-progress org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DskipTests -DoutputFormat=json
      - name: Audit frontend dependencies and generate SBOM
        working-directory: frontend-saas
        run: |
          npm ci
          npm audit --audit-level=high
          npm sbom --sbom-format=cyclonedx > ../frontend-saas.cdx.json
      - name: Upload dependency inventories
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saas-sbom
          path: |
            backend-saas/target/bom.json
            frontend-saas.cdx.json
          if-no-files-found: error
