spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${TPV_DB_URL}
    username: ${TPV_DB_USERNAME}
    password: ${TPV_DB_PASSWORD}

# El escritorio integrado publica la interfaz y actua como proxy de la API.
# El backend productivo no debe quedar expuesto directamente en la red local.
server:
  address: 127.0.0.1

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.tpverp.backend: INFO

tpv:
  backup:
    restore-journal-path: '${TPV_BACKUP_RESTORE_JOURNAL_PATH:C:\\ProgramData\\TPV ERP\\restore\\tpv-restore-journal.properties}'
    # Production limits are explicit and independent from the 256 MiB
    # development/default entry cap in application.yml.
    archive:
      max-entries: ${TPV_BACKUP_PROD_MAX_ENTRIES:500000}
      max-entry-bytes: ${TPV_BACKUP_PROD_MAX_ENTRY_BYTES:1073741824}
      max-total-bytes: ${TPV_BACKUP_PROD_MAX_TOTAL_BYTES:10737418240}
  license:
    saas-url: ${TPV_LICENSE_SAAS_URL}
  sync:
    central-url: ${TPV_SYNC_CENTRAL_URL:${TPV_LICENSE_SAAS_URL}}
    worker-enabled: ${TPV_SYNC_WORKER_ENABLED:true}
    worker-delay-ms: ${TPV_SYNC_WORKER_DELAY_MS:60000}
  verifactu:
    # Perfil productivo cerrado: ninguna variable de entorno puede degradar el
    # runtime a TEST/SANDBOX/SIMULATED. production-enabled conserva el ultimo
    # cerrojo operativo hasta completar las pruebas y la revision fiscal.
    endpoint-mode: PRODUCTION
    endpoint-environment: PRODUCTION
    runtime-class: REAL
    transport-mode: AEAT
    product-capability: VERIFACTU_ONLY
    dev-sandbox:
      enabled: false
    aeat-test-network-enabled: false
    production-enabled: ${TPV_VERIFACTU_PRODUCTION_ENABLED:false}
    worker-enabled: true
    producer-name: ${TPV_VERIFACTU_PRODUCER_NAME}
    producer-tax-id: ${TPV_VERIFACTU_PRODUCER_TAX_ID}
    system-name: ${TPV_VERIFACTU_SYSTEM_NAME}
    system-id: ${TPV_VERIFACTU_SYSTEM_ID}
    declaration-hash: ${TPV_VERIFACTU_DECLARATION_HASH}
    secret-directory: '${TPV_VERIFACTU_SECRET_DIRECTORY:C:\ProgramData\TPV ERP\secrets\verifactu}'
    secret-acl-mode: ${TPV_VERIFACTU_SECRET_ACL_MODE:STRICT}
    secret-service-account: '${TPV_VERIFACTU_SERVICE_ACCOUNT:NT SERVICE\TPVERPBackend}'
    export-job-directory: '${TPV_VERIFACTU_EXPORT_JOB_DIRECTORY:C:\\ProgramData\\TPV ERP\\exports\\fiscal}'
    export-job-single-instance: ${TPV_VERIFACTU_EXPORT_JOB_SINGLE_INSTANCE:true}
    export-job-max-records: ${TPV_VERIFACTU_EXPORT_JOB_MAX_RECORDS:1000000}
    export-job-max-xml-bytes: ${TPV_VERIFACTU_EXPORT_JOB_MAX_XML_BYTES:2000000000}
