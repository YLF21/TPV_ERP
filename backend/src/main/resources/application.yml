spring:
  task:
    scheduling:
      pool:
        size: ${TPV_SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: tpv-scheduler-
  application:
    name: TPV ERP Backend
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 110MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  address: ${TPV_SERVER_ADDRESS:127.0.0.1}
  port: ${TPV_SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
      group:
        liveness:
          include: ping
        readiness:
          include: db,tpvBusiness,tpvFiscal

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

tpv:
  monitoring:
    business:
      initial-delay-ms: ${TPV_MONITORING_INITIAL_DELAY_MS:5000}
      interval-ms: ${TPV_MONITORING_INTERVAL_MS:30000}
  installation:
    key-directory: ${TPV_KEY_DIRECTORY:${user.home}/.tpv-erp/keys}
    portable-secret-key: ${TPV_INSTALLATION_PORTABLE_SECRET_KEY:}
  license:
    issuer-public-key-file: ${TPV_LICENSE_ISSUER_PUBLIC_KEY_FILE:}
    local-file-activation-enabled: ${TPV_LICENSE_LOCAL_FILE_ACTIVATION_ENABLED:false}
  backup:
    default-directory: ${TPV_BACKUP_DIRECTORY:${user.home}/TPV-ERP-Backups}
    pg-dump-command: ${TPV_PG_DUMP_COMMAND:pg_dump}
    pg-restore-command: ${TPV_PG_RESTORE_COMMAND:pg_restore}
    # DB + filesystem cannot be atomic while the application is serving traffic.
    # Enable only under an explicitly coordinated maintenance procedure.
    restore-online-enabled: ${TPV_BACKUP_RESTORE_ONLINE_ENABLED:false}
    restore-journal-path: ${TPV_BACKUP_RESTORE_JOURNAL_PATH:}
    archive:
      max-entries: ${TPV_BACKUP_ARCHIVE_MAX_ENTRIES:100000}
      max-entry-bytes: ${TPV_BACKUP_ARCHIVE_MAX_ENTRY_BYTES:268435456}
      max-total-bytes: ${TPV_BACKUP_ARCHIVE_MAX_TOTAL_BYTES:2147483648}
  product-images:
    directory: ${TPV_PRODUCT_IMAGE_DIRECTORY:${user.home}/.tpv-erp/product-images}
  document-templates:
    directory: ${TPV_DOCUMENT_TEMPLATE_DIRECTORY:${user.home}/.tpv-erp/document-templates}
  verifactu:
    endpoint-mode: ${TPV_VERIFACTU_ENDPOINT_MODE:TEST}
    endpoint-environment: ${TPV_VERIFACTU_ENDPOINT_ENVIRONMENT:TEST}
    runtime-class: ${TPV_VERIFACTU_RUNTIME_CLASS:REAL}
    transport-mode: ${TPV_VERIFACTU_TRANSPORT_MODE:AEAT}
    dev-sandbox:
      enabled: ${TPV_VERIFACTU_DEV_SANDBOX_ENABLED:false}
    aeat-test-network-enabled: ${TPV_VERIFACTU_AEAT_TEST_NETWORK_ENABLED:false}
    production-enabled: ${TPV_VERIFACTU_PRODUCTION_ENABLED:false}
    secret-directory: ${TPV_VERIFACTU_SECRET_DIRECTORY:${user.home}/.tpv-erp/verifactu-secrets}
    secret-acl-mode: ${TPV_VERIFACTU_SECRET_ACL_MODE:PORTABLE}
    secret-service-account: '${TPV_VERIFACTU_SERVICE_ACCOUNT:NT SERVICE\TPVERPBackend}'
    system-name: ${TPV_VERIFACTU_SYSTEM_NAME:TPV ERP}
    system-id: ${TPV_VERIFACTU_SYSTEM_ID:01}
    # Maven binds this property to the same release manifest used by runtime.
    system-version: @tpv.release.version@
    producer-name: ${TPV_VERIFACTU_PRODUCER_NAME:TPV ERP DEV}
    producer-tax-id: ${TPV_VERIFACTU_PRODUCER_TAX_ID:B00000000}
    declaration-hash: ${TPV_VERIFACTU_DECLARATION_HASH:}
    worker-enabled: ${TPV_VERIFACTU_WORKER_ENABLED:false}
    worker-delay-ms: ${TPV_VERIFACTU_WORKER_DELAY_MS:60000}
    observability:
      initial-delay-ms: ${TPV_VERIFACTU_OBSERVABILITY_INITIAL_DELAY_MS:5000}
      interval-ms: ${TPV_VERIFACTU_OBSERVABILITY_INTERVAL_MS:60000}
      # Readiness uses the scheduler's cached projection and marks it stale
      # after this interval; probes never query the fiscal tables directly.
      stale-after-ms: ${TPV_VERIFACTU_OBSERVABILITY_STALE_AFTER_MS:180000}
    # Observes the persisted operating clock every minute; six operating hours
    # are accumulated before a type 10 summary is emitted.
    event-summary-interval-ms: ${TPV_VERIFACTU_EVENT_SUMMARY_INTERVAL_MS:60000}
    event-summary-initial-delay-ms: ${TPV_VERIFACTU_EVENT_SUMMARY_INITIAL_DELAY_MS:60000}
    certificate-warning-cron: ${TPV_VERIFACTU_CERTIFICATE_WARNING_CRON:0 0 9 * * *}
    certificate-purge-cron: ${TPV_VERIFACTU_CERTIFICATE_PURGE_CRON:0 0 3 1 * *}
    secret-deletion-delay-ms: ${TPV_VERIFACTU_SECRET_DELETION_DELAY_MS:60000}
